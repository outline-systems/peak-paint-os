name: Port Baywide modular Settings to Peak

on:
  push:
    branches: [main]
    paths: ['.github/workflows/port-baywide-settings.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current Baywide master source
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/outline-systems/baywide-dingos-os/main/index.html -o /tmp/baywide.html

      - name: Port modular Settings UI and behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, sys

          bay = Path('/tmp/baywide.html').read_text(errors='ignore')

          def adapt(s):
              reps = [
                  ('https://outline-systems.github.io/baywide-dingos-os/', 'https://outline-systems.github.io/peak-paint-os/'),
                  ('BAYWIDE DINGOS', 'PEAK PAINTING & DECORATING LTD'),
                  ('Baywide Dingos OS', 'Peak Paint OS'),
                  ('Baywide Dingos', 'Peak Painting'),
                  ('Baywide OS', 'Peak Paint OS'),
                  ("Baywide's", "Peak's"),
                  ('Baywide H&S Policy', 'Peak H&S Policy'),
                  ('No Baywide H&amp;S policy', 'No Peak H&amp;S policy'),
                  ('Baywide H&amp;S', 'Peak H&amp;S'),
                  ('Baywide Red', 'Peak Red'),
                  ('Baywide Blue', 'Peak Blue'),
                  ('aria-label=\\"Baywide Dingos OS\\"', 'aria-label=\\"Peak Paint OS\\"'),
              ]
              for a,b in reps: s=s.replace(a,b)
              # Calendar text can contain the shorter company name.
              s=s.replace("'Baywide · ", "'Peak · ").replace('"Baywide · ', '"Peak · ')
              return s

          def settings_block(text):
              marker='Company details &amp; document template'
              p=text.find(marker)
              if p < 0: raise RuntimeError('Settings marker not found')
              starts=[]
              for pat in ['<sc-if value=\\"{{ hqSettings }}\\">','<sc-if value="{{ hqSettings }}">']:
                  q=text.rfind(pat,0,p)
                  if q>=0: starts.append((q,pat))
              if not starts: raise RuntimeError('Settings start not found')
              st,sp=max(starts,key=lambda x:x[0])
              ends=[]
              for pat in ['<sc-if value=\\"{{ isHQ }}\\">','<sc-if value="{{ isHQ }}">']:
                  q=text.find(pat,p)
                  if q>=0: ends.append(q)
              if not ends: raise RuntimeError('Settings end not found')
              en=min(ends)
              return st,en,text[st:en]

          def scan_method(text,name):
              # Return the last class-style method declaration with this name.
              matches=list(re.finditer(r'(?m)^[ \t]{2}'+re.escape(name)+r'\s*\(', text))
              if not matches: return None
              m=matches[-1]
              start=m.start()
              i=m.end()-1
              par=0; quote=None; esc=False; line=False; block=False
              open_brace=None
              while i < len(text):
                  c=text[i]; n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                      i+=1; continue
                  if block:
                      if c=='*' and n=='/': block=False; i+=2; continue
                      i+=1; continue
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      i+=1; continue
                  if c in "'\"`": quote=c; i+=1; continue
                  if c=='/' and n=='/': line=True; i+=2; continue
                  if c=='/' and n=='*': block=True; i+=2; continue
                  if c=='(': par+=1
                  elif c==')':
                      par-=1
                      if par==0:
                          j=i+1
                          while j<len(text) and text[j].isspace(): j+=1
                          if j<len(text) and text[j]=='{': open_brace=j; break
                  i+=1
              if open_brace is None: return None
              depth=0; quote=None; esc=False; line=False; block=False; i=open_brace
              while i < len(text):
                  c=text[i]; n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                      i+=1; continue
                  if block:
                      if c=='*' and n=='/': block=False; i+=2; continue
                      i+=1; continue
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      i+=1; continue
                  if c in "'\"`": quote=c; i+=1; continue
                  if c=='/' and n=='/': line=True; i+=2; continue
                  if c=='/' and n=='*': block=True; i+=2; continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:
                          end=i+1
                          # include trailing newline
                          while end<len(text) and text[end] in ' \t': end+=1
                          if end<len(text) and text[end]=='\n': end+=1
                          return start,end,text[start:end]
                  i+=1
              return None

          def replace_or_insert_method(text,name,source_method):
              cur=scan_method(text,name)
              src=adapt(source_method)
              if cur:
                  a,b,_=cur
                  return text[:a]+src+text[b:]
              render=scan_method(text,'render')
              if not render: raise RuntimeError('render() insertion anchor not found for '+name)
              a=render[0]
              return text[:a]+src+'\n'+text[a:]

          # Build a map of Baywide methods by scanning likely class declarations.
          method_names=[]
          for m in re.finditer(r'(?m)^[ \t]{2}([A-Za-z_$][\w$]*)\s*\(',bay):
              n=m.group(1)
              if n not in method_names: method_names.append(n)
          bay_methods={}
          for n in method_names:
              x=scan_method(bay,n)
              if x: bay_methods[n]=x[2]

          roots=set([
              'prepareCompanyLogo','companyLogoUpload','companyLogoRemove','__policyRenderPdf','hsPolicyUpload','hsPolicyRemove',
              '__crewPhotoData','crewPhotoUpload','crewPhotoRemove',
              'gcalSetClient','gcalSetAuto','gcalSelectCalendar','__gcalReady','__gcalScript','__gcalApi','gcalConnect','gcalDisconnect','gcalLoadCalendars',
              '__gcalRef','__gcalSaveRef','__gcalDropRef','__localIso','__hoursSpan','__crewEmails','__projectByCode','__scheduleIntervalsFor','__localClashes',
              '__gcalProjectPayload','__gcalTaskPayload','__gcalUpsert','gcalDelete','gcalSyncProject','gcalSyncTask','gcalSyncAll','gcalCheckAvailability',
              'crewTaskNewHQ','crewTaskEditHQ','crewTaskAddHQ','crewTaskToggle','crewTaskDel',
              '__brandColor','__brandOnColor','setBrandColor','__docColor','setDocColor','setDocColorSync','__mixHex','__docThemeMap','__retintInlineStyles','__applyDocThemeTo','__applyTheme'
          ])

          missing_roots=sorted(n for n in roots if n not in bay_methods)
          if missing_roots: raise RuntimeError('Missing Baywide methods: '+', '.join(missing_roots))

          def patch_one(text,label):
              # 1. Exact current Baywide modular Settings markup.
              bs,be,bblock=settings_block(bay)
              ps,pe,pblock=settings_block(text)
              text=text[:ps]+adapt(bblock)+text[pe:]

              # 2. State additions. Keep Peak schema number unchanged.
              state_pos=text.rfind('\n  state = {')
              if state_pos<0: raise RuntimeError(label+': state block missing')
              tail=text[state_pos:]
              old="theme: 'dark', peakSchema: 4,"
              if old in tail:
                  tail=tail.replace(old,"theme: 'dark', brandColor: '#E1272A', docColor: '#E1272A', docColorSync: true, peakSchema: 4,",1)
              elif 'brandColor:' not in tail[:4000]:
                  raise RuntimeError(label+': theme/schema anchor missing')

              old="crewTasks: [], leaveReqs: [], crewNotes: [], roosters: [],"
              new="crewTasks: [], leaveReqs: [], crewNotes: [], roosters: [],\n    hqTaskWho: '', hqTaskJob: '', hqTaskText: '', hqTaskDue: '', hqTaskDate: '', hqTaskStart: '07:30', hqTaskEnd: '16:30', hqTaskPriority: 'Normal', hqTaskEditing: null, hqTaskFlash: '', hqTaskCalCheck: '',"
              if old in tail and 'hqTaskWho:' not in tail[:12000]: tail=tail.replace(old,new,1)

              # Expand the Peak company object into saved + editable draft state.
              m=re.search(r"\n\s*co:\s*\{[^\n]*name:\s*'PEAK PAINTING & DECORATING LTD'[^\n]*\},",tail)
              if m and 'coDraft:' not in tail[m.start():m.start()+1800]:
                  line=m.group(0)
                  obj=line[line.find('{'):line.rfind('}')+1]
                  if 'logo:' not in obj:
                      obj=obj[:-1]+", logo: '', logoName: '', hsPolicy: null, _ts: 0 }"
                  saved='\n    co: '+obj+','
                  draft='\n    coDraft: '+obj+", coFlash: '', coLogoMsg: '', coPolicyMsg: '',"
                  tail=tail[:m.start()]+saved+draft+tail[m.end():]
              elif 'coDraft:' not in tail:
                  raise RuntimeError(label+': Peak company state anchor missing')

              # Add Google/work email and photo fields to seed crew without touching names/rates.
              cm=re.search(r'\n\s*crew:\s*\[[^\n]*\],\s*crewNext:\s*5,',tail)
              if cm:
                  cl=cm.group(0)
                  cl=re.sub(r"pin:\s*([^,}]+)\s*}",r"pin: \1, googleEmail: '', photo: '' }",cl)
                  tail=tail[:cm.start()]+cl+tail[cm.end():]

              # Add Google Calendar state after crew seed.
              if 'gcalClientId:' not in tail[:30000]:
                  anchor=re.search(r'\n\s*crew:\s*\[[^\n]*\],\s*crewNext:\s*5,',tail)
                  if not anchor: raise RuntimeError(label+': crew seed anchor missing for calendar state')
                  ins="\n    gcalClientId: '', gcalCalendarId: 'primary', gcalCalendarName: 'Primary calendar', gcalCalendars: [], gcalAutoPublish: true, gcalEventIds: { project: {}, task: {} }, gcalStatus: 'Not connected', gcalBusy: false, gcalLastSync: '', pjCalCheck: '',"
                  tail=tail[:anchor.end()]+ins+tail[anchor.end():]
              text=text[:state_pos]+tail

              # 3. coF edits staged company draft, matching Baywide.
              old_re=r"const coF = \(k\) => \(e\) => this\.setState\(s => \(\{ co: \{ \.\.\.s\.co, \[k\]: e\.target\.value \} \}\)\);"
              repl="const coF = (k) => (e) => this.setState(s => ({ coDraft: { ...(s.coDraft || s.co || {}), [k]: e.target.value }, coFlash: '', coLogoMsg: '' }));"
              text,n=re.subn(old_re,repl,text,count=1)
              if n==0 and 'const coF = (k) => (e) => this.setState(s => ({ coDraft:' not in text:
                  raise RuntimeError(label+': coF anchor missing')

              # 4. Render-local variables required by company policy/logo bindings.
              co_pos=text.rfind('const coF = (k) =>')
              if co_pos<0: raise RuntimeError(label+': coF position missing')
              if '__coSavedPolicy' not in text[max(0,co_pos-3000):co_pos]:
                  var_anchor=bay.rfind('var __coSaved',0,bay.rfind('const coF = (k) =>'))
                  if var_anchor<0: raise RuntimeError('Baywide co variable anchor missing')
                  var_end=bay.find('const coF = (k) =>',var_anchor)
                  vars_src=adapt(bay[var_anchor:var_end])
                  text=text[:co_pos]+vars_src+text[co_pos:]

              # 5. Company return bindings. Keep existing quote/invoice bindings untouched.
              bind=text.rfind('      co: S.co,')
              if bind<0: raise RuntimeError(label+': return co binding missing')
              insert_end=bind+len('      co: S.co,')
              if 'coEdit:' not in text[bind:bind+8000]:
                  company_bind="""
 coEdit: (S.coDraft || S.co), brandName: String(((S.co || {}).name) || 'PEAK PAINTING & DECORATING LTD'), brandLogo: String(((S.co || {}).logo) || ''), brandLogoShow: !!String(((S.co || {}).logo) || ''), brandLogoFallback: !String(((S.co || {}).logo) || ''), brandLogoDraft: String(((S.coDraft || S.co || {}).logo) || ''), brandLogoDraftShow: !!String(((S.coDraft || S.co || {}).logo) || ''), brandLogoDraftFallback: !String(((S.coDraft || S.co || {}).logo) || ''), coLogoMsg: S.coLogoMsg || '', coLogoMsgShow: !!S.coLogoMsg, companyLogoUpload: (e) => this.companyLogoUpload(e), removeCompanyLogo: () => this.companyLogoRemove(), hsPolicyHas: !!(__coEditPolicy && (__coEditPolicy.pages || []).length), hsPolicyNone: !(__coEditPolicy && (__coEditPolicy.pages || []).length), hsPolicyName: (__coEditPolicy && __coEditPolicy.name) || '', hsPolicyMeta: (__coEditPolicy ? (((__coEditPolicy.pageCount || (__coEditPolicy.pages || []).length || 0) + ' page' + (((__coEditPolicy.pageCount || (__coEditPolicy.pages || []).length || 0) === 1) ? '' : 's') + ' · ' + this.fmtKB(__coEditPolicy.size || 0))) : ''), hsPolicyPages: hsPolicyPages, hsPolicyExportHas: hsPolicyPages.length > 0, hsPolicyExportName: (__coSavedPolicy && __coSavedPolicy.name) || 'Peak H&S Policy', hsPolicyIndexLabel: hsPolicyPages.length ? 'Appendix A' : 'Not attached', hsPolicyUpload: (e) => this.hsPolicyUpload(e), hsPolicyRemove: () => this.hsPolicyRemove(), coPolicyMsg: S.coPolicyMsg || '', coPolicyMsgShow: !!S.coPolicyMsg, coFlash: S.coFlash || '', coFlashShow: !!S.coFlash, saveCompany: () => { var next = Object.assign({}, (this.state.coDraft || this.state.co || {}), { _ts: Date.now() }); this.setState({ co: next, coDraft: Object.assign({}, next), coFlash: 'Saved and applied across the app.', coLogoMsg: next.logo ? 'Logo saved and applied across the app.' : '' }, () => { try { document.title = (next.name || 'Peak Paint OS') + ' · Peak Paint OS'; } catch (e) {} try { this.__peakSave(); } catch (e) {} try { this.syncPush(); } catch (e) {} var self = this; setTimeout(function () { if (self.state.coFlash) self.setState({ coFlash: '' }); }, 3200); }); },"""
                  text=text[:insert_end]+company_bind+text[insert_end:]

              # 6. Copy HQ task + upgraded crew + Calendar render bindings.
              b_start=bay.rfind('      hqTaskCrewOpts:')
              b_end=bay.find('      npCrewChips:',b_start)
              if b_start<0 or b_end<0: raise RuntimeError('Baywide crew/calendar binding segment missing')
              seg=adapt(bay[b_start:b_end])
              p_start=text.rfind('      crewRows:')
              p_end=text.find('      npCrewChips:',p_start)
              if p_start<0 or p_end<0: raise RuntimeError(label+': Peak crew binding segment missing')
              text=text[:p_start]+seg+text[p_end:]

              # 7. Copy upgraded Look & Feel + Recently Deleted bindings.
              # Runtime occurrence is after render start; choose the last formatted binding before planFilesView.
              b_plan=bay.rfind('      planFilesView:')
              b_look=bay.rfind('      brandColor:',0,b_plan)
              if b_look<0 or b_plan<0: raise RuntimeError('Baywide look/feel binding segment missing')
              look=adapt(bay[b_look:b_plan]).replace("Modern — Jakarta / Barlow","Peak — Jakarta / Barlow")
              p_plan=text.rfind('      planFilesView:')
              p_look=text.rfind('      cornerOpts:',0,p_plan)
              if p_look<0 or p_plan<0: raise RuntimeError(label+': Peak look/feel binding anchor missing')
              text=text[:p_look]+look+text[p_plan:]

              # 8. Port selected behavior methods plus missing transitive helpers.
              peak_names=set(m.group(1) for m in re.finditer(r'(?m)^[ \t]{2}([A-Za-z_$][\w$]*)\s*\(',text))
              selected=set(roots)
              queue=list(roots)
              while queue:
                  n=queue.pop()
                  src=bay_methods.get(n,'')
                  for ref in re.findall(r'this\.([A-Za-z_$][\w$]*)\s*\(',src):
                      if ref in bay_methods and ref not in selected and ref not in peak_names:
                          selected.add(ref); queue.append(ref)
              # Replace explicit roots (even if Peak has older implementations), insert missing dependencies.
              for n in sorted(selected):
                  if n in roots or n not in peak_names:
                      text=replace_or_insert_method(text,n,bay_methods[n])

              # 9. Sync/pull parity for saved company, brand/doc theme and settings collections.
              sk=scan_method(text,'__syncKeys')
              if not sk: raise RuntimeError(label+': __syncKeys missing')
              a,b,body=sk
              for key in ['co','brandColor','docColor','docColorSync']:
                  if ("'"+key+"'") not in body:
                      body=body.replace(']; }',", '"+key+"']; }")
              text=text[:a]+body+text[b:]

              ms=scan_method(text,'__mergeState')
              if not ms: raise RuntimeError(label+': __mergeState missing')
              a,b,body=ms
              # Merge the same Settings collections Baywide now merges.
              m=re.search(r"\['quotes'.*?'clockEvents'\]\.forEach",body)
              if m:
                  arr=m.group(0)
                  if "'crewTasks'" not in arr:
                      arr=arr.replace("'clockEvents'","'clockEvents', 'crewTasks', 'leaveReqs', 'crewNotes', 'roosters', 'contacts', 'recycle'")
                      body=body[:m.start()]+arr+body[m.end():]
              if 'remote.co && typeof remote.co' not in body:
                  pos=body.rfind('return out;')
                  if pos<0: raise RuntimeError(label+': merge return missing')
                  add="['pkCorner','pkType','brandColor','docColor','docColorSync'].forEach(function (k) { if (remote[k] !== undefined) out[k] = remote[k]; }); if (remote.co && typeof remote.co === 'object') { var lc = s.co || {}, rc = remote.co || {}; out.co = ((+lc._ts || 0) > (+rc._ts || 0)) ? Object.assign({}, rc, lc) : Object.assign({}, lc, rc); out.coDraft = Object.assign({}, out.co); } "
                  body=body[:pos]+add+body[pos:]
              text=text[:a]+body+text[b:]

              # Sanity: never overwrite Peak workspace or painting content.
              must=[
                  'Company details &amp; document template','Crew &amp; employees','Integrations','Look &amp; feel','Recently deleted',
                  'Connect Google Calendar','companyLogoUpload','hsPolicyUpload','crewPhotoUpload','gcalConnect','setBrandColor','coDraft:',
                  "ws: 'peak-hb'",'PEAK PAINTING & DECORATING LTD','Interior','Exterior'
              ]
              for s in must:
                  if s not in text: raise RuntimeError(label+': required token missing: '+s)
              if "ws: 'baywide-dingos-os'" in text: raise RuntimeError(label+': Baywide workspace leaked into Peak')
              # Settings panel itself must not still present Baywide customer branding.
              qs,qe,qb=settings_block(text)
              for bad in ['Baywide Dingos','Baywide OS',"Baywide's"]:
                  if bad in qb: raise RuntimeError(label+': Baywide branding remains in Settings: '+bad)
              return text

          targets=['index.html']
          if Path('preview/index.html').exists(): targets.append('preview/index.html')
          for f in targets:
              p=Path(f); old=p.read_text(errors='ignore'); new=patch_one(old,f); p.write_text(new)
              print(f'{f}: {len(old)} -> {len(new)} bytes')
          PY

      - name: Static regression checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for f in ['index.html','preview/index.html']:
            if not Path(f).exists(): continue
            t=Path(f).read_text(errors='ignore')
            assert t.count('Company details &amp; document template') >= 1
            assert 'Connect Google Calendar' in t
            assert 'Google / work email' in t
            assert 'Tender H&amp;S policy' in t
            assert 'Save company details' in t
            assert "ws: 'peak-hb'" in t
            assert 'Peak Painting HB SOR 2026' in t
            print(f,'static checks OK')
          PY

      - name: Commit application update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html preview/index.html
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Match Peak Settings to Baywide modular UI"
            git push
          fi
