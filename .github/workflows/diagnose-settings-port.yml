name: Diagnose Settings port

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-settings-port.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: curl -fsSL https://raw.githubusercontent.com/outline-systems/baywide-dingos-os/main/index.html -o /tmp/baywide.html
      - run: python3 tools/run_port_settings_v4.py
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Diagnose browser
        run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1440,height:1100}});
            const errs=[]; p.on('pageerror',e=>errs.push(String(e))); p.on('console',m=>{if(m.type()==='error') errs.push('console:'+m.text())});
            await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await p.waitForTimeout(1000);
            console.log('ERRORS',JSON.stringify(errs));
            console.log('BODY',(await p.locator('body').innerText().catch(()=>'' )).slice(0,5000));
            console.log('BUTTONS',JSON.stringify(await p.locator('button').allTextContents().catch(()=>[])));
            console.log('HTML', (await p.locator('body').innerHTML().catch(()=>'' )).slice(0,3000));
            await p.screenshot({path:'diagnose-settings.png',fullPage:true});
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnose-settings-port
          path: diagnose-settings.png
          if-no-files-found: warn
