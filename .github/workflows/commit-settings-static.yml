name: Commit verified Settings port

on:
  push:
    branches: [main]
    paths: ['.github/settings-port-commit.trigger']

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Patch, verify and commit
        shell: bash
        run: |
          set +e
          curl -fsSL https://raw.githubusercontent.com/outline-systems/baywide-dingos-os/main/index.html -o /tmp/baywide.html
          if [ $? -ne 0 ]; then echo FETCH_FAILED; exit 0; fi
          python3 tools/run_port_settings_v5.py > /tmp/port.log 2>&1
          if [ $? -ne 0 ]; then echo PATCH_FAILED; cat /tmp/port.log; exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          req=['Company details &amp; document template','Crew &amp; employees','Integrations','Look &amp; feel','Recently deleted','Connect Google Calendar','Google / work email','Tender H&amp;S policy','Save company details']
          ok=True
          for f in ['index.html','preview/index.html']:
              p=Path(f)
              if not p.exists(): continue
              t=p.read_text(errors='ignore')
              missing=[x for x in req if x not in t]
              if missing:
                  print(f,'MISSING',missing); ok=False
              for marker in ['peak-hb','Peak Painting HB SOR 2026']:
                  if marker not in t:
                      print(f,'MISSING_PEAK_MARKER',marker); ok=False
          Path('/tmp/static-ok').write_text('1' if ok else '0')
          PY
          if [ "$(cat /tmp/static-ok)" != "1" ]; then echo STATIC_FAILED; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html preview/index.html
          if git diff --cached --quiet; then echo NO_CHANGES; exit 0; fi
          git commit -m 'Match Peak Settings to Baywide modular UI'
          git push
          echo PUSH_EXIT=$?
