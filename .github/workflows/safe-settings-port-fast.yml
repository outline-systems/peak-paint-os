name: Fast verified Settings port

on:
  push:
    branches: [main]
    paths: ['.github/settings-port-fast.trigger']

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and verify statically
        shell: bash
        run: |
          set +e
          curl -fsSL https://raw.githubusercontent.com/outline-systems/baywide-dingos-os/main/index.html -o /tmp/baywide.html
          if [ $? -ne 0 ]; then echo FETCH_FAILED > /tmp/status; exit 0; fi
          python3 tools/run_port_settings_v5.py > /tmp/port.log 2>&1
          if [ $? -ne 0 ]; then echo PATCH_FAILED > /tmp/status; cat /tmp/port.log; exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          req=['Company details &amp; document template','Crew &amp; employees','Integrations','Look &amp; feel','Recently deleted','Connect Google Calendar','Google / work email','Tender H&amp;S policy','Save company details']
          ok=True
          for f in ['index.html','preview/index.html']:
              p=Path(f)
              if not p.exists(): continue
              t=p.read_text(errors='ignore')
              missing=[x for x in req if x not in t]
              if missing: print(f,'missing',missing); ok=False
              if 'peak-hb' not in t: print(f,'missing Peak workspace'); ok=False
              if 'Peak Painting HB SOR 2026' not in t: print(f,'missing Peak rates'); ok=False
          Path('/tmp/status').write_text('STATIC_OK' if ok else 'STATIC_FAILED')
          PY
          cat /tmp/status
      - name: Fast browser QA using runner Chrome
        shell: bash
        run: |
          set +e
          [ "$(cat /tmp/status 2>/dev/null)" = "STATIC_OK" ] || { echo SKIP_BROWSER; exit 0; }
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.55.0 >/dev/null 2>&1
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          sleep 1
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs=require('fs');
          (async()=>{
            const candidates=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium-browser','/usr/bin/chromium'];
            const exe=candidates.find(x=>fs.existsSync(x));
            if(!exe){ console.log('NO_SYSTEM_BROWSER'); return; }
            const b=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox']});
            const p=await b.newPage({viewport:{width:1440,height:1100}});
            const errs=[];p.on('pageerror',e=>errs.push(String(e)));
            await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            let mg=p.getByRole('button',{name:/Management/i}); if(await mg.count()) await mg.first().click({force:true});
            await p.waitForTimeout(300);
            let settings=p.getByRole('button',{name:'Settings',exact:true}); if(!await settings.count()) throw new Error('Settings nav missing');
            await settings.first().click({force:true}); await p.waitForTimeout(500);
            let text=await p.locator('body').innerText();
            for(const x of ['Company details & document template','Crew & employees','Integrations','Look & feel','Recently deleted']) if(!text.includes(x)) throw new Error('Missing '+x);
            for(const name of ['Company details & document template','Crew & employees','Integrations','Look & feel','Recently deleted']) {
              const s=p.locator('summary:visible').filter({hasText:name}); if(!await s.count()) throw new Error('No accordion '+name);
            }
            await p.locator('summary:visible').filter({hasText:'Company details & document template'}).first().click({force:true}); await p.waitForTimeout(100);
            text=await p.locator('body').innerText(); for(const x of ['Company logo','Tender H&S policy','Save company details']) if(!text.includes(x)) throw new Error('Company missing '+x);
            await p.locator('summary:visible').filter({hasText:'Crew & employees'}).first().click({force:true}); await p.waitForTimeout(100);
            text=await p.locator('body').innerText(); for(const x of ['Google / work email','Add employee']) if(!text.includes(x)) throw new Error('Crew missing '+x);
            await p.locator('summary:visible').filter({hasText:'Integrations'}).first().click({force:true}); await p.waitForTimeout(100);
            text=await p.locator('body').innerText(); if(!/Google Calendar/i.test(text)) throw new Error('Google Calendar missing');
            await p.locator('summary:visible').filter({hasText:'Look & feel'}).first().click({force:true}); await p.waitForTimeout(100);
            text=await p.locator('body').innerText(); if(!/Document accent|App colour|Corners|Typeface/i.test(text)) throw new Error('Look & Feel controls missing');
            await p.locator('summary:visible').filter({hasText:'Recently deleted'}).first().click({force:true}); await p.waitForTimeout(100);
            await p.screenshot({path:'peak-settings-fast.png',fullPage:true});
            if(errs.length) throw new Error('Page errors: '+errs.join(' | '));
            fs.writeFileSync('/tmp/browser-fast-ok','1');
            await b.close();
            console.log('BROWSER_OK');
          })().catch(e=>{console.log('BROWSER_FAILED',String(e));});
          NODE
      - name: Commit only verified patch
        shell: bash
        run: |
          set +e
          if [ "$(cat /tmp/browser-fast-ok 2>/dev/null)" != "1" ]; then echo NOT_COMMITTED; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html preview/index.html
          if git diff --cached --quiet; then echo NO_CHANGES; exit 0; fi
          git commit -m 'Match Peak Settings to Baywide modular UI'
          git push
          echo PUSH_EXIT=$?
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peak-settings-fast-result
          path: peak-settings-fast.png
          if-no-files-found: ignore
