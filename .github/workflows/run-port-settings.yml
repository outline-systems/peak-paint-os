name: Run Settings port

on:
  push:
    branches: [main]
    paths: ['.github/port-settings.trigger']

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Settings port workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run port-baywide-settings.yml --ref main
