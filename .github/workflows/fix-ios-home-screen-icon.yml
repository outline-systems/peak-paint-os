name: Fix iOS home screen icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ios-home-screen-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Peak Paint home screen icon and fix project-relative paths
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64, json

          icon_b64 = ''''''
          Path('apple-touch-icon.png').write_bytes(base64.b64decode(icon_b64))
          manifest = {
              'name': 'Peak Paint OS',
              'short_name': 'Peak Paint',
              'start_url': './',
              'scope': './',
              'display': 'standalone',
              'background_color': '#0C0D0F',
              'theme_color': '#0C0D0F',
              'icons': [{'src':'./apple-touch-icon.png','sizes':'180x180','type':'image/png','purpose':'any maskable'}]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest, separators=(',',':')))
          Path('sw.js').write_text("self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));")

          p = Path('index.html')
          text = p.read_text()
          text = text.replace('href="/manifest.webmanifest"','href="./manifest.webmanifest"')
          text = text.replace('href="/apple-touch-icon.png"','href="./apple-touch-icon.png"')
          text = text.replace('navigator.serviceWorker.register("/sw.js")','navigator.serviceWorker.register("./sw.js")')
          p.write_text(text)

          preview = Path('preview/index.html')
          if preview.exists():
            t = preview.read_text()
            t = t.replace('href="/manifest.webmanifest"','href="../manifest.webmanifest"')
            t = t.replace('href="/apple-touch-icon.png"','href="../apple-touch-icon.png"')
            t = t.replace('navigator.serviceWorker.register("/sw.js")','navigator.serviceWorker.register("../sw.js")')
            preview.write_text(t)
          PY
      - name: Commit and publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html preview/index.html apple-touch-icon.png manifest.webmanifest sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Fix Peak Paint iOS home screen icon"
            git push
          fi
