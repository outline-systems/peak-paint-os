name: Safe Settings port

on:
  push:
    branches: [main]
    paths: ['.github/settings-port.trigger']

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run port safely
        shell: bash
        run: |
          set +e
          curl -fsSL https://raw.githubusercontent.com/outline-systems/baywide-dingos-os/main/index.html -o /tmp/baywide.html
          CURL=$?
          if [ "$CURL" -ne 0 ]; then echo 'FETCH_FAILED' > /tmp/settings-port-status; exit 0; fi
          python3 tools/run_port_settings_v5.py > /tmp/port.log 2>&1
          PATCH=$?
          if [ "$PATCH" -ne 0 ]; then
            echo 'PATCH_FAILED' > /tmp/settings-port-status
            cat /tmp/port.log
            exit 0
          fi
          echo 'PATCH_OK' > /tmp/settings-port-status
          cat /tmp/port.log
      - name: Static verification
        shell: bash
        run: |
          set +e
          if ! grep -q '^PATCH_OK' /tmp/settings-port-status; then echo 'Skipping static verification'; exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          required=['Company details &amp; document template','Crew &amp; employees','Integrations','Look &amp; feel','Recently deleted','Connect Google Calendar','Google / work email','Tender H&amp;S policy','Save company details']
          ok=True
          for f in ['index.html','preview/index.html']:
              p=Path(f)
              if not p.exists(): continue
              t=p.read_text(errors='ignore')
              miss=[x for x in required if x not in t]
              if miss:
                  print(f,'MISSING',miss); ok=False
              if "ws: 'peak-hb'" not in t and 'peak-hb' not in t:
                  print(f,'missing Peak workspace marker'); ok=False
              if 'Peak Painting HB SOR 2026' not in t:
                  print(f,'missing Peak rate-library marker'); ok=False
          Path('/tmp/static-ok').write_text('1' if ok else '0')
          PY
      - name: Browser verification
        shell: bash
        run: |
          set +e
          [ "$(cat /tmp/static-ok 2>/dev/null)" = "1" ] || { echo 'Skipping browser QA'; exit 0; }
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs=require('fs');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1440,height:1100}});
            const errs=[];p.on('pageerror',e=>errs.push(String(e)));
            await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            let mg=p.getByRole('button',{name:/Management/i}); if(await mg.count()) await mg.first().click({force:true});
            await p.waitForTimeout(400);
            let settings=p.getByRole('button',{name:'Settings',exact:true});
            if(!await settings.count()) throw new Error('Settings navigation missing');
            await settings.first().click({force:true}); await p.waitForTimeout(600);
            const body=await p.locator('body').innerText();
            for(const x of ['Company details & document template','Crew & employees','Integrations','Look & feel','Recently deleted']) if(!body.includes(x)) throw new Error('Missing '+x);
            for(const x of ['Company details & document template','Crew & employees','Integrations','Look & feel','Recently deleted']) {
              const s=p.locator('summary:visible').filter({hasText:x});
              if(!await s.count()) throw new Error('Accordion missing '+x);
            }
            await p.locator('summary:visible').filter({hasText:'Company details & document template'}).first().click({force:true}); await p.waitForTimeout(150);
            let txt=await p.locator('body').innerText(); for(const x of ['Company logo','Tender H&S policy','Save company details']) if(!txt.includes(x)) throw new Error('Company panel missing '+x);
            await p.locator('summary:visible').filter({hasText:'Crew & employees'}).first().click({force:true}); await p.waitForTimeout(150);
            txt=await p.locator('body').innerText(); for(const x of ['Google / work email','Add employee']) if(!txt.includes(x)) throw new Error('Crew panel missing '+x);
            await p.locator('summary:visible').filter({hasText:'Integrations'}).first().click({force:true}); await p.waitForTimeout(150);
            txt=await p.locator('body').innerText(); if(!/Google Calendar/i.test(txt)) throw new Error('Google Calendar missing');
            await p.locator('summary:visible').filter({hasText:'Look & feel'}).first().click({force:true}); await p.waitForTimeout(150);
            txt=await p.locator('body').innerText(); if(!/Document accent|App colour|Corners|Typeface/i.test(txt)) throw new Error('Look & Feel controls missing');
            await p.locator('summary:visible').filter({hasText:'Recently deleted'}).first().click({force:true}); await p.waitForTimeout(150);
            await p.screenshot({path:'peak-settings-parity.png',fullPage:true});
            if(errs.length) throw new Error('Page errors: '+errs.join(' | '));
            fs.writeFileSync('/tmp/browser-ok','1');
            await b.close();
          })().catch(e=>{console.error(e);process.exitCode=0;});
          NODE
      - name: Commit only if verified
        shell: bash
        run: |
          set +e
          if [ "$(cat /tmp/browser-ok 2>/dev/null)" != "1" ]; then echo 'NOT_COMMITTED: verification did not pass'; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html preview/index.html
          if git diff --cached --quiet; then echo 'NO_CHANGES'; exit 0; fi
          git commit -m 'Match Peak Settings to Baywide modular UI'
          git push
          echo 'COMMITTED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safe-settings-port-result
          path: peak-settings-parity.png
          if-no-files-found: ignore
