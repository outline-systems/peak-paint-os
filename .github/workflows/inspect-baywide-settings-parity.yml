name: Inspect Baywide Settings parity

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-baywide-settings-parity.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Baywide source and inspect Settings code
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/outline-systems/baywide-dingos-os/main/index.html -o /tmp/baywide.html
          python3 <<'PY'
          from pathlib import Path
          import re, json
          sources={'BAYWIDE':Path('/tmp/baywide.html').read_text(errors='ignore'),'PEAK':Path('index.html').read_text(errors='ignore')}
          needles=[
            'Company settings','Company details & document template','Crew & employees','Integrations','Look & feel','Recently deleted',
            'Connect Baywide OS to Google Calendar','Sync Google Calendar','Check availability','Tender H&S policy','company details',
            'renderSettings','SettingsPage','settingsView','settingsSection','recently deleted','google calendar','calendar'
          ]
          out=[]
          for name,text in sources.items():
            out.append(f'===== {name} length={len(text)} =====')
            for needle in needles:
              positions=[m.start() for m in re.finditer(re.escape(needle),text,re.I)]
              if positions:
                out.append(f'\n--- {needle!r}: {len(positions)} hit(s) at {positions[:20]} ---')
                for pos in positions[:8]:
                  a=max(0,pos-2600); b=min(len(text),pos+5000)
                  out.append(text[a:b].replace('\n','\\n'))
          Path('settings-inspection.txt').write_text('\n'.join(out))
          print('\n'.join(out)[:120000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: settings-parity-inspection
          path: settings-inspection.txt
