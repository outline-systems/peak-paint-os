name: Inspect Baywide Settings parity

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-baywide-settings-parity.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Settings accordion bindings
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/outline-systems/baywide-dingos-os/main/index.html -o /tmp/baywide.html
          python3 <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/baywide.html').read_text(errors='ignore')
          for pat in ['hqSetPanels:', 'hqSetPanel:', 'hqCrewPanel:', 'hqIntPanel:', 'hqLookPanel:', 'hqTrashPanel:', 'hqTaskWhoV:', 'hqTaskRows:', 'hsPolicyHas:']:
              ps=[m.start() for m in re.finditer(re.escape(pat),t)]
              print('\nPAT',pat,'LAST',ps[-4:])
              for p in ps[-2:]: print(t[max(0,p-1000):min(len(t),p+5000)])
          marker='Company details &amp; document template'
          p=t.find(marker)
          st=t.rfind('<sc-if value="{{ hqSettings }}">',0,p)
          en=t.find('<sc-if value="{{ isHQ }}">',p)
          print('\nSETTINGS BLOCK',st,en,en-st)
          print(t[st:min(en,st+15000)])
          PY
