name: Inspect Baywide Settings parity

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-baywide-settings-parity.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Settings state and draft behavior
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/outline-systems/baywide-dingos-os/main/index.html -o /tmp/baywide.html
          python3 <<'PY'
          from pathlib import Path
          import re
          for label,path in [('BAY','/tmp/baywide.html'),('PEAK','index.html')]:
              t=Path(path).read_text(errors='ignore')
              print('\n===== '+label+' =====')
              for pat in ['coF =', 'const coF', 'let coF', 'var coF', "co: { name:", 'co: {name:', 'coDraft:', "theme: 'dark'", '__syncKeys()', '__mergeState(']:
                  ps=[m.start() for m in re.finditer(re.escape(pat),t)]
                  print('\nPAT',repr(pat),ps[-6:])
                  for p in ps[-2:]: print(t[max(0,p-1800):min(len(t),p+4000)])
          PY
