name: Inspect Baywide Settings parity

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-baywide-settings-parity.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Settings behavior definitions
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/outline-systems/baywide-dingos-os/main/index.html -o /tmp/baywide.html
          python3 <<'PY'
          from pathlib import Path
          import re
          bay=Path('/tmp/baywide.html').read_text(errors='ignore')
          peak=Path('index.html').read_text(errors='ignore')
          tokens=['companyLogoUpload','removeCompanyLogo','uploadHsPolicy','hsPolicy','coDraft','saveCompany','crewRows','uploadPhoto','googleEmail','hqTaskRows','newHqTask','addHqTask','checkTaskCal','gcalClientIdV','setGcalClientId','connectGcal','disconnectGcal','reloadGcals','syncGcalAll','toggleGcalAuto','brandColor','setBrandColor','paletteOpts','docColor','setDocColor','toggleDocColorSync','docPaletteOpts','cornerOpts','typeOpts','binRows']
          for label,t in [('BAY',bay),('PEAK',peak)]:
              js_start=t.find('state = {')
              print(f'===== {label} JS START {js_start} =====')
              for tok in tokens:
                  positions=[m.start() for m in re.finditer(re.escape(tok),t)]
                  jspos=[p for p in positions if p>=js_start]
                  print(f'\n### {tok} total={len(positions)} js={len(jspos)} firstjs={jspos[0] if jspos else -1}')
                  for p in jspos[:4]:
                      a=max(js_start,p-1200); b=min(len(t),p+2800)
                      s=t[a:b]
                      # keep source formatting; collapse very long base64-ish strings
                      s=re.sub(r'data:image/[^;]+;base64,[A-Za-z0-9+/=]{300,}', 'DATA_IMAGE_REDACTED', s)
                      print(s)
          PY
