name: Inspect Baywide Settings parity

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-baywide-settings-parity.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect escaped Settings template block
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/outline-systems/baywide-dingos-os/main/index.html -o /tmp/baywide.html
          python3 <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/baywide.html').read_text(errors='ignore')
          marker='Company details &amp; document template'
          p=t.find(marker)
          print('MARKER',p)
          print('AROUND MARKER:',t[max(0,p-4000):p+12000])
          for pat in ['<sc-if value=\\"{{ hqSettings }}\\">','<sc-if value="{{ hqSettings }}">','hqSettings','<sc-if value=\\"{{ isHQ }}\\">','<sc-if value="{{ isHQ }}">']:
            ps=[m.start() for m in re.finditer(re.escape(pat),t)]
            print('\nPAT',repr(pat),'positions',ps[:20],ps[-20:])
          PY
