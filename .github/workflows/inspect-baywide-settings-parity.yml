name: Inspect Baywide Settings parity

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-baywide-settings-parity.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: List Settings helper signatures
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/outline-systems/baywide-dingos-os/main/index.html -o /tmp/baywide.html
          python3 <<'PY'
          from pathlib import Path
          import re
          bay=Path('/tmp/baywide.html').read_text(errors='ignore')
          peak=Path('index.html').read_text(errors='ignore')
          names=set()
          for m in re.finditer(r'(?<![\.\w])([A-Za-z_$][\w$]*)\s*\(([^()]|\([^()]*\))*\)\s*\{',bay):
              n=m.group(1)
              if any(x in n.lower() for x in ['gcal','companylogo','hspolicy','crewphoto','brandcolor','doccolor','doctheme','retint','crewtask']) or n in ['__applyTheme','readAsDataURL','shrinkImage','fmtKB','__mixHex']:
                  names.add(n)
          print('METHODS',sorted(names))
          for n in sorted(names):
              print(n,'peak_has=', bool(re.search(r'(?<![\.\w])'+re.escape(n)+r'\s*\(',peak)))
          # exact positions of key helpers, plus 2k around each
          for n in sorted(names):
              pos=bay.find(n+'(')
              if pos>=0:
                  print('\n---',n,'@',pos,'---')
                  print(bay[max(0,pos-300):min(len(bay),pos+1800)])
          PY
