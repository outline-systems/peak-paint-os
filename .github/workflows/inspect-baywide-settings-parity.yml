name: Inspect Baywide Settings parity

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-baywide-settings-parity.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Settings render binding anchors
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/outline-systems/baywide-dingos-os/main/index.html -o /tmp/baywide.html
          python3 <<'PY'
          from pathlib import Path
          import re
          for label,path in [('BAY','/tmp/baywide.html'),('PEAK','index.html')]:
              t=Path(path).read_text(errors='ignore')
              print('\n===== '+label+' =====')
              # Find likely render bindings after JS state declaration.
              for pat in ['coEdit:', 'coLogoMsg:', 'hqTaskWhoOpts:', 'crewRows:', 'gcalClientIdV:', 'brandColor:', 'cornerOpts:', 'binRows:', 'planFilesView:']:
                  pos=[m.start() for m in re.finditer(re.escape(pat),t)]
                  print('\nPAT',pat,'LAST',pos[-4:])
                  for p in pos[-2:]:
                      print('--- pos',p,'---')
                      print(t[max(0,p-900):min(len(t),p+2600)])
          PY
