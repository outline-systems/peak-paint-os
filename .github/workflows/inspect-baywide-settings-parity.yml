name: Inspect Baywide Settings parity

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-baywide-settings-parity.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect transplant anchors
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/outline-systems/baywide-dingos-os/main/index.html -o /tmp/baywide.html
          python3 <<'PY'
          from pathlib import Path
          import re
          for label,path in [('BAY','/tmp/baywide.html'),('PEAK','index.html')]:
            t=Path(path).read_text(errors='ignore')
            print('\n====',label,'len',len(t),'====')
            for pat in ['hqSettings','Company details &amp; document template','Company details','gcalClientId','gcalClientIdV','connectGcal','hqTaskWho','crewRows','brandColor','binRows','class ','constructor(','this.state =','state = {']:
              pos=t.find(pat)
              print('\nPAT',pat,'POS',pos)
              if pos>=0:
                a=max(0,pos-1800); b=min(len(t),pos+4200)
                print(t[a:b].replace('\n','\\n'))
          PY
